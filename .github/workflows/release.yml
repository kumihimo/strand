name: Release

# Builds the Windows installer, the .deb and the AppImage, then SHA256SUMS and its GPG signature, as one
# workflow artifact, and attaches them to a draft GitHub Release on the tag, published by hand. The updater's
# feed files (latest.yml, latest-linux.yml and the installer's blockmap) go with them: installed copies see a
# release only once it is published (ADR 0025). The Windows
# installer is not Authenticode-signed yet; SHA256SUMS, signed with the release key, covers it. The signing and
# publishing jobs use the `release` environment, which only v* tags may use, so they never run for a pull request
# or a fork. Actions are pinned to full commit SHAs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    # A tag must name the version in package.json and point at a commit on main.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::run on the tag v$version (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::v$version is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: guard
    # The oldest supported runner, so the packages work on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: npm run dist:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            release/strand_${{ needs.guard.outputs.version }}_amd64.deb
            release/Strand-${{ needs.guard.outputs.version }}.AppImage
            release/latest-linux.yml

  windows:
    needs: guard
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:ui

      # Two steps, the unpacked tree and then the installer over it with --prepackaged, so that signing the
      # app's exe can slot in between later: a signing service cannot sign the exe inside an NSIS installer.
      - run: npm run dist:win:unpacked
      - run: npm run dist:win:installer

      - name: Scan with Defender, install silently and check the installed app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "release/Strand-Setup-$env:VERSION.exe").Path

          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { Write-Warning "Defender signature update exited $LASTEXITCODE; scanning with the current signatures" }
          & $mp -Scan -ScanType 3 -File $installer -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender scan exited $LASTEXITCODE" }

          $p = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Strand\strand.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not installed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            release/Strand-Setup-${{ env.VERSION }}.exe
            release/Strand-Setup-${{ env.VERSION }}.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  checksums:
    needs: [guard, linux, windows]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: out
      - name: Write SHA256SUMS
        run: >-
          node scripts/checksums.ts --out out/SHA256SUMS
          "out/Strand-Setup-$VERSION.exe" "out/strand_${VERSION}_amd64.deb" "out/Strand-$VERSION.AppImage"
      - name: Sign SHA256SUMS, then verify against the committed release key only
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sign=$(mktemp -d); verify=$(mktemp -d)
          trap 'rm -rf "$sign" "$verify"' EXIT
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --homedir "$sign" --batch --import
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --homedir "$sign" --batch --pinentry-mode loopback \
            --passphrase-fd 0 --detach-sign --armor --output out/SHA256SUMS.asc out/SHA256SUMS
          gpg --homedir "$verify" --batch --import RELEASE-KEY.asc
          gpg --homedir "$verify" --batch --verify out/SHA256SUMS.asc out/SHA256SUMS
          (cd out && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strand-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            out/Strand-Setup-${{ env.VERSION }}.exe
            out/strand_${{ env.VERSION }}_amd64.deb
            out/Strand-${{ env.VERSION }}.AppImage
            out/SHA256SUMS
            out/SHA256SUMS.asc
            out/latest.yml
            out/latest-linux.yml
            out/Strand-Setup-${{ env.VERSION }}.exe.blockmap

  publish:
    # Attaches the checked files to a draft GitHub Release on the tag; the engineer publishes it after the hand
    # checks. A re-run replaces the assets of a draft, but never touches a published release.
    needs: [guard, checksums]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: strand-${{ needs.guard.outputs.version }}
          path: out
      - name: Create or update the draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          files=(out/Strand-Setup-"$VERSION".exe out/strand_"$VERSION"_amd64.deb out/Strand-"$VERSION".AppImage
            out/SHA256SUMS out/SHA256SUMS.asc out/latest.yml out/latest-linux.yml out/Strand-Setup-"$VERSION".exe.blockmap)
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::release $tag is already published; not replacing its assets"; exit 1; }
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft --verify-tag --title "Strand $VERSION" \
              --notes "Verify the downloads before installing: see \"Desktop app packages\" in the README."
          fi
